name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Create Web Directory and Index
        run: |
          mkdir -p www
          if [ -d "public" ]; then cp -r public/* www/ 2>/dev/null || true; fi
          if [ -d "src" ]; then cp -r src www/ 2>/dev/null || true; fi
          if [ -f "index.html" ]; then cp index.html www/; else echo '<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Radar</title></head><body><div id="root"></div></body></html>' > www/index.html; fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Radar" "com.radar.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Radar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
