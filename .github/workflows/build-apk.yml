name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          [ -d "public" ] && cp -r public/* www/ || true
          [ -d "src" ] && cp -r src www/ || true
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Radar</title></head><body><div id="root"></div></body></html>' > www/index.html

      - name: Setup Capacitor and Add Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Radar com.radar.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
