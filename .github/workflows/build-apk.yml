name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          [ -d "public" ] && cp -r public/* www/ || true
          [ -d "src" ] && cp -r src www/ || true
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Radar</title></head><body><div id="root"></div></body></html>' > www/index.html
          fi

      - name: Build APK via Capacitor Alternative CLI
        run: |
          npm init -y
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest="https://raw.githubusercontent.com/ilias889/radar-app/main/public/manifest.json" --directory=. 2>/dev/null || true
          
          # Fallback Build using Android SDK Direct Command
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init Radar com.radar.app --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
