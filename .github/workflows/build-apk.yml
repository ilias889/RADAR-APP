name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Create Package JSON & Install Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install react react-dom @supabase/supabase-js lucide-react
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets
        run: |
          mkdir -p www
          cp -r public/* www/ 2>/dev/null || true
          cp -r src www/ 2>/dev/null || true
          if [ -f index.html ]; then cp index.html www/; fi

      - name: Initialize Capacitor
        run: |
          npx cap init "Radar" "com.radar.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Radar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
